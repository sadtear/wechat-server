# 服务器配置
server:
  port: 3000
  api_token: "your-api-token"  # Yi-API 访问凭证

# 公众号配置（支持多个）
accounts:
  - app_id: "wx1234567890"
    app_secret: "your-app-secret-1"
    token: "your-wechat-token-1"
    name: "公众号A"

  - app_id: "wx0987654321"
    app_secret: "your-app-secret-2"
    token: "your-wechat-token-2"
    name: "公众号B"

# 验证码配置
code:
  length: 6           # 验证码长度
  expire_minutes: 5   # 有效期（分钟）
  # 公众号内触发验证码回复的关键词，用户发送任意一个即可获取验证码
  trigger_words:
    - "验证码"
    - "登录"
    - "code"
    - "login"

# 公众号消息配置
messages:
  # 用户关注公众号后的自动回复内容；支持多行文本和公众号可识别的链接标签
  subscribe_reply: |
    欢迎关注 AI80！

    我们提供 AI API 聚合平台，一个 Key 用遍 Claude、GPT、Gemini 等主流模型。

    <a href="https://code.ai80.vip">Code80 — AI API 平台（主站）</a>
    <a href="https://chat.ai80.vip">AI 对话助手（在线体验）</a>

    回复【教程】获取接入指南
    回复【客服】联系人工客服

    平台支持按量计费、团队共享、API Key 自助管理。
    推广合作详情回复【合作】
